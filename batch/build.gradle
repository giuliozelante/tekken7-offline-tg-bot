plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow'
    id 'org.graalvm.buildtools.native'
    id 'io.micronaut.application'
    id 'io.micronaut.aot'
    id 'com.palantir.git-version'
}

group = "it.giuliozelante.tekken7.offline.tg.bot.batch"

application {
    mainClass.set("it.giuliozelante.tekken7.offline.tg.bot.batch.Batch")
}

dependencies {
    // Minimal Micronaut dependencies with explicit versions
    implementation 'io.micronaut:micronaut-core:4.2.3'
    implementation 'io.micronaut:micronaut-inject:4.2.3'
    
    // Any additional dependencies specific to the batch module
    // can be added here
}

// Configure Micronaut for the batch module
micronaut {
    version '4.2.3'
    
    runtime("netty")
    processing {
        incremental(true)
        annotations("it.giuliozelante.tekken7.offline.tg.bot.batch.*")
    }
}