plugins {
        id 'application'
        id 'com.github.johnrengelman.shadow'
        id 'io.micronaut.application'
        id 'io.micronaut.aot'
        id 'com.palantir.git-version'
}

group = "it.giuliozelante.tekken7.offline.tg.bot"

repositories {
    mavenCentral()
}

application {
    mainClass.set('it.giuliozelante.tekken7.offline.tg.bot.App')
}

dependencies {
    annotationProcessor 'io.micronaut.data:micronaut-data-processor'
    annotationProcessor 'io.micronaut.serde:micronaut-serde-processor'
    annotationProcessor 'io.micronaut:micronaut-http-validation'
    
    implementation 'io.micronaut:micronaut-http-client'
    implementation 'io.micronaut.serde:micronaut-serde-jackson'
    implementation 'io.micronaut.data:micronaut-data-hibernate-jpa'
    implementation 'io.micronaut.sql:micronaut-jdbc-hikari'
    
    implementation 'org.telegram:telegrambots:6.8.0'
    implementation 'org.telegram:telegrambots-abilities:6.8.0'
    implementation 'org.telegram:telegrambotsextensions:6.8.0'
    
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'org.apache.commons:commons-text:1.10.0'
    implementation 'commons-io:commons-io:2.11.0'
    
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpcore:4.4.16'
    implementation 'org.apache.httpcomponents:httpmime:4.5.14'
    
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2'
    
    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    
    implementation 'edu.cmu.sphinx:sphinx4-core:5prealpha'
    implementation 'edu.cmu.sphinx:sphinx4-data:5prealpha'
    
    implementation 'p6spy:p6spy:3.9.1'
    
    runtimeOnly 'com.h2database:h2'
    
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.3'
    testImplementation 'org.mockito:mockito-core:5.4.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.4.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

tasks.named("optimizedDockerBuild") {
    images.set(["${rootProject.name}:${project.version}", "${rootProject.name}:latest"])
}