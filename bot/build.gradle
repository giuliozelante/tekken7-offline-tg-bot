plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow'
    id 'io.micronaut.application'
    id 'io.micronaut.aot'
    id 'com.palantir.git-version'
}

group = "it.giuliozelante.tekken7.offline.tg.bot"

application {
    mainClass.set('it.giuliozelante.tekken7.offline.tg.bot.App')
}

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor 'io.micronaut.data:micronaut-data-processor',
        'io.micronaut.serde:micronaut-serde-processor',
        'io.micronaut:micronaut-http-validation'
    implementation 'jakarta.annotation:jakarta.annotation-api',
        'io.micronaut:micronaut-http-client',
        'io.micronaut.data:micronaut-data-hibernate-jpa',
        'io.micronaut.serde:micronaut-serde-jackson',
        'io.micronaut.sql:micronaut-jdbc-hikari',
        'io.micronaut.xml:micronaut-jackson-xml',
        'javax.xml.bind:jaxb-api:2.3.1',
        'org.telegram:telegrambots:6.9.7.1',
        'p6spy:p6spy:3.9.1',
        'net.sf.phat:sphinx4-core:5prealpha',
        'net.sf.phat:sphinx4-data:5prealpha',
        'org.slf4j:slf4j-api:2.0.9',
        'ch.qos.logback:logback-classic:1.4.11',
        'io.github.jaredmdobson:concentus:1.0.2',
        'org.gagravarr:vorbis-java-core:0.8',
        'com.googlecode.soundlibs:vorbisspi:1.0.3.3'
    compileOnly 'io.micronaut:micronaut-http-client'
    runtimeOnly 'com.h2database:h2',
        'org.yaml:snakeyaml:2.2'
}

tasks.named("optimizedDockerBuild") {
    images.set(["${rootProject.name}:${project.version}", "${rootProject.name}:latest"])
}